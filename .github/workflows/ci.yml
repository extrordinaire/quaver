name: Quaver CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Lua 5.4
            interpreter: lua@5.4
          - label: LuaJIT 2.1
            interpreter: luajit@2.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: .ci/quaver
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          ref: ab59713d6a5a014b4f5b84ec7ab07d9e0a44044d
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/valua
          ref: 253601b7e8841458d62efe4bcdd1f7441a56887b
          path: .ci/valua
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Moonstone build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum zstd
      - name: Build Moonstone CLI
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Synchronize Quaver
        working-directory: .ci/quaver
        run: moon sync
      - name: Run the full test suite
        working-directory: .ci/quaver
        run: moon run test --interpreter "${{ matrix.interpreter }}"

  package:
    name: Verify Ballad artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: .ci/quaver
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          ref: ab59713d6a5a014b4f5b84ec7ab07d9e0a44044d
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/valua
          ref: 253601b7e8841458d62efe4bcdd1f7441a56887b
          path: .ci/valua
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Moonstone build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum zstd
      - name: Build Moonstone CLI
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Synchronize Quaver
        working-directory: .ci/quaver
        run: moon sync
      - name: Run the real Valua partiture example
        working-directory: .ci/quaver
        run: moon exec -- ballad play examples/valua.partiture.lua
      - name: Verify reproducible source package
        working-directory: .ci/quaver
        run: sh scripts/verify-release-artifact.sh
